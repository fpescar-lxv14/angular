<table mat-table [dataSource]="dataSource">
    <tr matColumnDef="Foto">
        <th mat-header-cell *matHeaderCellDef> Foto </th>
        <td mat-cell *matCellDef="let element"> <img [src]="element.picture.thumbnail" [alt]="element.id.user"></td>
      </tr>
    <tr matColumnDef="Candidato">
        <th mat-header-cell *matHeaderCellDef> Candidato </th>
        <td mat-cell *matCellDef="let element"> {{element.name.last}} {{element.name.first}}</td>
    </tr>
    <tr matColumnDef="Correo">
        <th mat-header-cell *matHeaderCellDef> Correo </th>
        <td mat-cell *matCellDef="let element"> <a [href]="'mailto:'+element.email">{{element.email}}</a> </td>
    </tr>
    <tr matColumnDef="Telefono">
        <th mat-header-cell *matHeaderCellDef> Telefono </th>
        <td mat-cell *matCellDef="let element"> <a [href]="'tel:'+element.phone">{{element.phone}}</a> </td>
    </tr>
    <tr matColumnDef="Celular">
        <th mat-header-cell *matHeaderCellDef> Celular </th>
        <td mat-cell *matCellDef="let element"> <a [href]="'tel:'+element.cell">{{element.cell}}</a> </td>
    </tr>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons/>
