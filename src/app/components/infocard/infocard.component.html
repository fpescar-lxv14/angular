<mat-card appearance="outlined">
    <mat-card-header>
    <img mat-card-avatar [src]="user?.picture?.large" [alt]="user?.login?.username">
        <mat-card-title>
            {{ user?.name?.title }}
            {{ user?.name?.last }}
            {{ user?.name?.first }}
        </mat-card-title>
        <mat-card-subtitle>
            <a [href]="'mailto:'+user?.email" target="_blank">{{ user?.email }}</a>
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <mat-list>
            <mat-divider/>
            <li matListItemLine>
                <strong>Telefono: </strong>
                <a [href]="'tel:'+user?.phone">{{user?.phone}}</a>
            </li>
            <mat-divider/>
            <li matListItemLine>
                <strong>Celular: </strong>
                <a [href]="'tel:'+user?.phone">{{user?.cell}}</a>
            </li>
            <mat-divider/>
        </mat-list>
    </mat-card-content>
    <mat-card-footer>
        <mat-card-actions>
            <button mat-flat-button (click)="handleDiscard()" color="primary">Descartar</button>
            <button mat-flat-button (click)="handleSelect()" color="accent">Seleccionar</button>
        </mat-card-actions>
    </mat-card-footer>
</mat-card>
